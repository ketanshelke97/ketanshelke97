name: Generate GitHub Koi

on:
  schedule:
    - cron: "0 0 * * *" # Runs just after midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1.0.2
        
      - name: Commit and Push Koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git commit -m "koi: draw the day's koi" || exit 0
          git push
